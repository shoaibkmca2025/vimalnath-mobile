server {
  listen 80;
  root /usr/share/nginx/html;

  # shortcut: assumes this is the first server a request reaches. If a host ends HTTPS before it, pass that host's X-Forwarded-* values through instead.
  location /v1/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Addresses like /orders/42 are admin screens, not files.
  location / {
    try_files $uri /index.html;
  }
}
