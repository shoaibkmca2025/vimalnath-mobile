name: Server checks

on:
  push:
    paths: ['server/**', 'admin/src/data/types.ts', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'admin/src/data/types.ts', '.github/workflows/server.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vimalnath
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: vimalnath
        ports:
          - 5433:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          DATABASE_URL: postgres://vimalnath:local-only@127.0.0.1:5433/vimalnath
